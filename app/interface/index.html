<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Santinel — Parc informatique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- écran de connexion ---------- -->
<section id="connexion" class="ecran-connexion">
  <form class="panneau" id="formulaire" autocomplete="off">
    <span class="onglet-haut"></span>
    <span class="coin hg"></span><span class="coin hd"></span>
    <span class="coin bg"></span><span class="coin bd"></span>
    <span class="flanc gauche"></span><span class="flanc droite"></span>

    <img class="logo-connexion" src="santinel.png" alt="Santinel">
    <h1>CONNEXION</h1>

    <label class="champ-hud">
      <span class="icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.6-8 5.8V22h16v-2.2c0-3.2-3.6-5.8-8-5.8Z"/>
        </svg>
      </span>
      <input id="utilisateur" name="utilisateur" placeholder="Utilisateur" autocomplete="off">
    </label>

    <label class="champ-hud">
      <span class="icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
          <path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Z"/>
        </svg>
      </span>
      <input id="motdepasse" name="motdepasse" type="password" placeholder="Mot de passe">
    </label>

    <p id="erreur" class="erreur" hidden></p>
    <button type="submit" class="bouton-hud">Accéder au parc</button>
  </form>
</section>

<!-- ---------- application ---------- -->
<div id="appli" hidden>

  <header>
    <div class="marque">
      <img src="santinel.png" alt="Santinel">
      <span>Parc informatique</span>
    </div>

    <div class="recherche">
      <input id="terme" type="search" autocomplete="off"
             placeholder="Nom, utilisateur, courriel, poste ou numéro de série…">
    </div>
    <nav class="onglets">
      <button class="onglet actif" data-vue="tous">Tout le parc</button>
      <button class="onglet" data-vue="retardataires">
        À mettre à jour <span id="compteur-retard" class="pastille">0</span>
      </button>
    </nav>

    <button id="theme" type="button" class="bouton-deconnexion icone-seule"
            title="Mode sombre" aria-label="Changer de thème"></button>

    <div class="menu-compte">
      <button id="bouton-compte" type="button" class="bouton-deconnexion"
              aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.6-8 5.8V22h16v-2.2c0-3.2-3.6-5.8-8-5.8Z"/>
        </svg>
        Compte
        <svg class="chevron" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>

      <div id="menu-compte" class="menu" hidden>
        <button id="voir-compte" type="button" class="element-menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.6-8 5.8V22h16v-2.2c0-3.2-3.6-5.8-8-5.8Z"/>
          </svg>
          Compte
        </button>
        <button id="deconnexion" type="button" class="element-menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5v-2H6V6h4V4Zm5.6 3.6-1.4 1.4 2 2H9v2h7.2l-2 2 1.4 1.4L20 12l-4.4-4.4Z"/>
          </svg>
          Déconnexion
        </button>
      </div>
    </div>
  </header>

  <main>
    <section id="liste" class="liste" aria-label="Fiches"></section>
    <section id="detail" class="detail" aria-label="Détail de la fiche">
      <p class="vide">Sélectionnez une fiche à gauche.</p>
    </section>
  </main>

  <footer><span id="etat">Chargement…</span></footer>

  <div id="fenetre-compte" class="voile" hidden>
    <div class="boite" role="dialog" aria-labelledby="titre-compte">
      <h2 id="titre-compte">Compte</h2>
      <dl class="infos-compte">
        <dt>Utilisateur</dt><dd id="compte-utilisateur">—</dd>
        <dt>Droits</dt><dd id="compte-role">—</dd>
        <dt>Fichier de données</dt><dd id="compte-base">—</dd>
      </dl>
      <button id="fermer-compte" type="button" class="bouton-etat">Fermer</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
